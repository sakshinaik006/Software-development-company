# ===== Central configuration: container & orchestration server (Docker + Swarm) for 40 developers =====
HOSTNAME_NEW="devserver01"
INSTALL_DIR="/opt/devserver"          # project is copied here by Member 3 (cron/dashboard use it)
LOG_DIR="/var/log/devserver"

# ---- Users / groups (Member 1) ----
DEV_COUNT=40
DEV_PREFIX="dev"                      # dev01 ... dev40
DEV_GROUP="developers"
CRED_FILE="/root/dev_credentials.txt"
PROJECTS="alpha beta gamma"           # shared repos / project dirs

# ---- Storage (Member 2) ----
# LAB_MODE=loop : safe mode, creates sparse image files used as virtual disks (works on any VM)
# LAB_MODE=disk : uses real spare disks listed in DISKS  (DATA ON THEM IS DESTROYED)
LAB_MODE="loop"
LOOP_DIR="/var/lab-disks"
LOOP_DISK_COUNT=3
LOOP_DISK_SIZE="8G"        # 3 x 8G pool (3+3+3 for repos/projects/backup + 6 for Docker)
DISKS="/dev/sdb /dev/sdc"

VG_NAME="vg_devserver"
LV_REPOS="lv_repos";       LV_REPOS_SIZE="3G";    REPOS_MNT="/srv/repos";    REPOS_FS="ext4"
LV_PROJECTS="lv_projects"; LV_PROJECTS_SIZE="3G"; PROJECTS_MNT="/srv/projects"; PROJECTS_FS="ext4"
LV_BACKUP="lv_backup";     LV_BACKUP_SIZE="3G";   BACKUP_MNT="/backup";      BACKUP_FS="xfs"

BACKUP_DIR="/backup/daily"
BACKUP_SRC="/srv/repos /srv/projects /etc /home /var/lib/docker/volumes /var/lib/docker/swarm"
RETENTION_DAYS=7

# ---- Monitoring thresholds (Member 3) ----
CPU_ALERT=85
MEM_ALERT=90
DISK_ALERT=85
LOAD_ALERT=4.0

# ---- Dashboard (Member 4) ----
DASH_PORT=8080

# ---- Cloud / off-site backup (optional) ----
CLOUD_ENABLE="no"                       # set to "yes" after running:  rclone config
CLOUD_REMOTE="remote:devserver-backups" # <rclone-remote-name>:<bucket-or-folder>
CLOUD_KEEP_DAYS=30                      # delete cloud copies older than this

# ---- Docker: THE main application - one shared daemon for all developers ----
DOCKER_ENABLE="yes"
DOCKER_GROUP="docker"
LV_DOCKER="lv_docker"; LV_DOCKER_SIZE="6G"; DOCKER_MNT="/var/lib/docker"; DOCKER_FS="ext4"
DOCKER_USERNS="no"        # "yes" = container root is mapped to an unprivileged uid (safer; breaks --privileged / host networking)
DOCKER_LOG_MAX="10m"      # per-container log size cap (3 files kept)
DOCKER_PRUNE_AGE="168h"   # weekly cleanup removes stopped containers / unused images older than this (volumes are never pruned)

# ---- Orchestration: Docker Swarm (this server = manager; workers can join later) ----
SWARM_ENABLE="yes"
SWARM_ADVERTISE_ADDR=""   # empty = first IP of this server; set it if the server has several network cards
SWARM_NET="devnet"        # shared overlay network for developer stacks
SWARM_PEERS=""            # space-separated IPs of other swarm nodes (e.g. cloud VMs); firewall opens 2377,7946,4789 for them only
STACKS_DIR="$PROJECTS_MNT/shared-tools/stacks"
REGISTRY_ENABLE="yes"     # private image registry on localhost:5000
